notes: >-
  This is a development pilot, not a replacement for the frozen 80-case study.
  Same NASA geometry, nine prescribed IDs, initial state, dynamics and safety gates.
  New candidate positions and graph-specific HCW transfers are generated before
  scenario evaluation. Every generated dropout case is retained. A missing-view
  or unreachable-target proof establishes infeasibility; a checked independent
  MILP route establishes feasibility. Solver limits without a witness remain
  unresolved. A common 15-second per-method budget includes model construction
  or ADP initialization but excludes shared geometry and graph construction.
  Each method is evaluated from scratch; ADP is not initialized with MILP routes.
  Scaling depends on library redundancy, independently certified feasibility and
  computational practicality, never on whether ADP outperforms a comparator.
