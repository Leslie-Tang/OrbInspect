    cw_energy_weight: 5.0
    cw_tracking_weight: 0.18
    cw_safety_weight: 120.0
    adp_candidate_limit: 24
    adp_branch_width: 8
    adp_candidate_pool_width: 18
    adp_lookahead_depth: 2
    adp_training_episodes: 0
    adp_learning_rate: 0.025
    adp_exploration_rate: 0.30
    adp_terminal_penalty: 500.0
    adp_action_cost: 0.05
