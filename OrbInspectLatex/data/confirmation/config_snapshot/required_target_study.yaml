notes: >-
  This confirmation follows the first required-target campaign, which exposed
  failure of the greedy seed. The nine-item geometric requirement is copied
  unchanged. The comparator is three-pass audited local search initialized by
  a successful one-step rollout ADP route; it is not a non-ADP baseline.
  Target sets, depth three, comparator, fresh seeds, and scoring are frozen
  before this campaign is evaluated. No scenario is rejected or replaced.
  A failed one-step seed leaves seeded local search without a certified route.
  ADP3 has no one-step fallback. All base_* fields refer to the original greedy
  completion. Timing of seeded local search includes its one-step seed.
